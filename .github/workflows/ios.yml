name: iOS Build

on:
  push:
    branches: [dev, master, main, 'feat/ios-*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: |
          python3 ios/scripts/generate_project.py
          mkdir -p ios/build
      - name: Reservation HTML extraction tests
        working-directory: ios/Tests
        run: |
          npm ci --ignore-scripts
          npm test 2>&1 | tee ../build/html-tests.log
      - name: Core unit tests
        working-directory: ios
        run: swift test 2>&1 | tee build/core-tests.log
      - name: Build unsigned device IPA
        run: bash ios/scripts/build.sh
      - name: Upload iOS packages
        uses: actions/upload-artifact@v4
        with:
          name: NITechSearch-iOS
          path: ios/build/artifacts/NITechSearch-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-TestResults
          path: ios/build/*tests.log
          retention-days: 14
